<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Set Portal Password | ADC Systems</title>
<link rel="icon" type="image/png" href="assets/images/adc-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/portal.css">
</head>
<body>
<header class="portal-topbar"><div class="wrap"><a class="portal-brand" href="index.html"><img src="assets/images/adc-icon.png" alt="ADC Systems"><span><strong>ADC SYSTEMS</strong><span>Training Portal</span></span></a></div></header>
<main class="auth-shell">
  <div class="auth-card">
    <div class="auth-logo"><img src="assets/images/adc-icon.png" alt="ADC Systems logo"></div>
    <h1>Set your portal password</h1>
    <p class="auth-sub">Create a password so you can sign in without requesting another email link.</p>
    <form id="setPasswordForm" novalidate>
      <div class="field"><label for="newPassword">New password</label><input type="password" id="newPassword" minlength="8" required></div>
      <div class="field"><label for="confirmPassword">Confirm password</label><input type="password" id="confirmPassword" minlength="8" required></div>
      <button type="submit" class="btn btn-red btn-block">Save password</button>
    </form>
    <div id="formMsg" class="form-msg"></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" defer></script>
<script src="js/supabase-client.js" defer></script>
<script src="js/portal-auth.js" defer></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var form = document.getElementById("setPasswordForm");
    var msg = document.getElementById("formMsg");
    function show(text, type) { msg.textContent = text; msg.className = "form-msg is-visible " + type; }
    if (!window.ADCPortal) return;
    window.ADCPortal.requireSession().then(function () {
      form.addEventListener("submit", function (event) {
        event.preventDefault();
        var password = document.getElementById("newPassword").value;
        var confirmation = document.getElementById("confirmPassword").value;
        if (password.length < 8 || password !== confirmation) {
          show("Use a password of at least 8 characters and make both passwords match.", "error");
          return;
        }
        window.ADCPortal.setPassword(password).then(function (result) {
          if (result.error) throw result.error;
          show("Password saved. Redirecting to your dashboard...", "success");
          setTimeout(function () { window.location.href = "dashboard.html"; }, 700);
        }).catch(function (error) { show(error.message || "Could not save your password.", "error"); });
      });
    });
  });
</script>
</body>
</html>
